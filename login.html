<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | PawPets</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="simple-header"><a class="brand" href="index.html">🐾 PawPets</a><a href="registro.html">Crear
            cuenta</a></header>
    <main class="auth-page">
        <form id="formularioLogin" class="formulario" novalidate>
            <p class="eyebrow">Bienvenido de vuelta</p>
            <h1>Ingresa a PawPets</h1>
            <p class="form-intro">Selecciona el perfil con el que ingresarás.</p>
            <div class="field"><label for="rol">Tipo de usuario</label><select id="rol" name="rol" required>
                    <option value="">Seleccione un rol</option>
                    <option value="cliente">Cliente</option>
                    <option value="vendedor">Vendedor</option>
                    <option value="administrador">Administrador</option>
                </select><span id="errorRol" class="error-msg"></span></div>
            <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email"
                    maxlength="100" autocomplete="email" required><span id="errorEmail" class="error-msg"></span></div>
            <div class="field"><label for="password">Contraseña</label><input id="password" name="password"
                    type="password" minlength="4" maxlength="10" autocomplete="current-password" required><span
                    id="errorPassword" class="error-msg"></span></div>
            <button class="btn btn-primary" type="submit">Ingresar</button>
            <p id="mensajeLogin" class="success-msg"></p>
            <p class="form-footer">¿No tienes cuenta? <a href="registro.html">Regístrate como cliente</a></p>
        </form>
    </main>
    <script src="js/validaciones.js"></script>
</body>

</html>

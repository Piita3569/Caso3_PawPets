<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | PawPets</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="nav container"><a class="brand" href="index.html">🐾 PawPets</a><button class="nav-toggle"
                aria-expanded="false" aria-controls="nav-links">Menú</button>
            <div class="nav-links" id="nav-links"><a href="index.html">Inicio</a><a
                    href="productos.html">Productos</a><a href="nosotros.html">Nosotros</a><a
                    href="blogs.html">Blog</a><a class="active" href="contacto.html">Contacto</a><a
                    href="login.html">Ingresar</a><a class="cart-button" href="carrito.html">🛒 <b
                        id="contador-carrito">0</b></a></div>
        </nav>
    </header>
    <main class="auth-page">
        <form id="formularioContacto" class="formulario" novalidate>
            <p class="eyebrow">Hablemos</p>
            <h1>¿Cómo podemos ayudarte?</h1>
            <div class="field"><label for="contactoNombre">Nombre</label><input id="contactoNombre" name="nombre"
                    maxlength="100" autocomplete="name" required><span id="errorContactoNombre"
                    class="error-msg"></span></div>
            <div class="field"><label for="contactoEmail">Correo electrónico</label><input id="contactoEmail"
                    name="email" type="email" maxlength="100" autocomplete="email" required><span
                    id="errorContactoEmail" class="error-msg"></span></div>
            <div class="field"><label for="comentario">Mensaje</label><textarea id="comentario" name="comentario"
                    maxlength="500" required placeholder="Cuéntanos en qué podemos ayudarte"></textarea><span
                    id="errorComentario" class="error-msg"></span></div><button class="btn btn-primary"
                type="submit">Enviar mensaje</button>
            <p id="mensajeContacto" class="success-msg" aria-live="polite"></p>
        </form>
    </main>
    <footer class="site-footer">
        <p class="copyright">© 2026 PawPets</p>
    </footer>
    <script src="js/validaciones.js"></script>
    <script src="js/tienda.js"></script>
    <script src="js/ui.js"></script>
</body>

</html>
